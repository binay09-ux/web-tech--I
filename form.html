<!DOCTYPE html>
<html>
<head>
    <title>Nested Table Example</title>
</head>
<form>
<label for="First name">First name</label>
<input id="First name" type="text" placeholder="Enter your first name"></input><br>
<label for="Last name">Last name</label>
<input id="Last name" type="text" placeholder="Enter your Last name"></input><br>
<label for="email">Email</label>
<input id="email" type="email" placeholder="Enter your email"></input><br>
<label for="pass">Password</label>
<input id="pass" type="password"></input><br>
<label for="gender">Gender: </label>
<input type="radio" value="male" name="gender"> Male
<input  type="radio" value="Female" name="gender"> Female
<input type="radio" value="other" name="gender"> Other<br>
Nationality:
<select>
<option>Nepali</option>
<option>Indian</option>
<option selected>Chinese</option>
<option>Japaneese</option>
<option>Palastani</option>
<option>Bangali</option>
</select>
<br>
Date: <input type="datetime-local"><br>
Hobbies: <br> <label id="Reading">Reading</label>
 <input type="checkbox" id="Dance" name="Hobbies" value="Reading" > <br>
 <label id="Dance">Dance</label>
<input type="checkbox" id="Dance" name="Hobbies" value="Dance" > <br>
<label>Enter your Description:</label><br> 
<textarea style="height: 100px; width: 300px;  resize: none;" placeholder="Description"></textarea><br>
<button>Submit</button>
<input type="reset" value="Reset">
</form>

</body>
</html>
